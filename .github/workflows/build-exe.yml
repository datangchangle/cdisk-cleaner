name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller -F -w --clean -n CDiskCleaner cleaner_main.py

      - name: Create Release with EXE
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "exe-" + (Get-Date -Format "yyyyMMdd-HHmmss")
          gh release create $tag "dist/CDiskCleaner.exe#C盘清理大师.exe" `
            --title "C盘清理大师 Windows 版" `
            --notes "下载后双击即可运行，无需安装 Python。`n如被 Windows SmartScreen 拦截：点击[更多信息] -> [仍要运行]。`n建议右键以管理员身份运行，可清理系统级缓存。"
